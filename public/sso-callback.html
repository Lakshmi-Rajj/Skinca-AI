<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Skinca AI — Completing Sign In...</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0a1210;
      color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 3px solid rgba(110, 231, 183, 0.2);
      border-top-color: #6ee7b7;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    h1 { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
    p { font-size: 13px; color: rgba(255,255,255,0.6); }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <h1>Completing Sign In...</h1>
  <p>Returning you to Skinca AI</p>

  <script>
    (function() {
      var params = window.location.search;
      var hash = window.location.hash;
      var isAndroid = /Android/i.test(navigator.userAgent);

      if (isAndroid) {
        // Android: try to open the installed APK via custom scheme.
        // If APK is not installed, the fallback timer redirects to the web app.
        var nativeUrl = 'com.skinca.ai://sso-callback' + params + hash;
        var fallbackTimer = setTimeout(function() {
          // APK not installed (or failed to open) — load the React SPA instead
          window.location.replace('/' + params + hash);
        }, 2000);
        // Attempt native deep link (Android will intercept if APK is installed)
        window.location.href = nativeUrl;
        // Do NOT clearTimeout — let the timer fire as a safety net
      } else {
        // Desktop / iOS browser: skip native link, load React SPA directly
        // The SPA's AuthenticateWithRedirectCallback will handle the __clerk_handshake
        window.location.replace('/' + params + hash);
      }
    })();
  </script>
</body>
</html>

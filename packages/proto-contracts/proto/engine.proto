syntax = "proto3";

package platform.engine;

option go_package = "github.com/skincare/proto/engine";
option java_multiple_files = true;
option java_package = "com.platform.proto.engine";

// Recommendation Engine gRPC Service Definition
service RecommendationService {
  rpc GenerateRecommendation (RecommendationRequest) returns (RecommendationResponse);
}

message RecommendationRequest {
  string tenant_id = 1;
  string user_id = 2;
  string skin_type = 3;                       // DRY, OILY, COMBINATION, SENSITIVE, NORMAL
  repeated string skin_concerns = 4;           // ACNE, HYPERPIGMENTATION, AGING, REDNESS, DEHYDRATION
  string sensitivity_level = 5;               // LOW, MEDIUM, HIGH
  repeated string allergies = 6;               // INCI names or allergen flags
  repeated string preferred_product_types = 7; // CLEANSER, SERUM, MOISTURIZER, SUNSCREEN
  repeated string excluded_ingredients = 8;    // INCI names to strictly exclude
  double max_budget = 9;                      // Optional budget limit
  repeated CandidateProduct candidate_products = 10;
  TenantRuleConfig tenant_config = 11;
}

message CandidateProduct {
  string id = 1;
  string name = 2;
  string category = 3;                         // Cleanser, Serum, Moisturizer, Sunscreen, etc.
  string product_type = 4;
  string status = 5;                           // DRAFT, ACTIVE, ARCHIVED
  double price = 6;
  repeated string compatible_skin_types = 7;
  repeated string target_skin_concerns = 8;
  repeated ProductIngredientItem ingredients = 9;
}

message ProductIngredientItem {
  string ingredient_id = 1;
  string inci_name = 2;
  string display_name = 3;
  repeated string functions = 4;
  repeated string skin_types = 5;
  repeated string skin_concerns = 6;
  string irritation_risk = 7;
  bool is_primary_active = 8;
}

message TenantRuleConfig {
  double weight_compatibility = 1;
  double weight_concern_coverage = 2;
  double weight_safety = 3;
  double weight_ingredient_quality = 4;
  int32 max_morning_products = 5;
  int32 max_evening_products = 6;
}

message RecommendationResponse {
  bool success = 1;
  Routine morning_routine = 2;
  Routine evening_routine = 3;
  repeated RecommendedProduct all_ranked_products = 4;
  repeated RejectedProduct rejected_products = 5;
  Explanation explanation = 6;
}

message Routine {
  string routine_type = 1;                    // MORNING, EVENING
  repeated RecommendedProduct steps = 2;
  repeated string missing_steps = 3;
  double total_cost = 4;
}

message RecommendedProduct {
  string product_id = 1;
  string name = 2;
  string category = 3;
  double price = 4;
  double total_score = 5;
  ScoreBreakdown score_breakdown = 6;
  repeated string matched_concerns = 7;
  repeated string matched_ingredients = 8;
}

message ScoreBreakdown {
  double compatibility_score = 1;
  double concern_coverage_score = 2;
  double safety_score = 3;
  double ingredient_quality_score = 4;
}

message RejectedProduct {
  string product_id = 1;
  string name = 2;
  string rejection_reason = 3;
  string conflicting_ingredient = 4;
}

message Explanation {
  repeated string summary_bullets = 1;
  int32 total_candidates_evaluated = 2;
  int32 total_eligible_products = 3;
  int32 total_rejected_products = 4;
}

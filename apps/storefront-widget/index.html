<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Storefront Skincare Recommendation Widget Demo</title>
  </head>
  <body style="margin: 0; padding: 40px; background-color: #f8fafc;">
    <div style="max-width: 600px; margin: 0 auto;">
      <h2 style="font-family: sans-serif; margin-bottom: 24px;">Storefront Embed Demo</h2>
      <div id="skincare-recommendation-container"></div>
    </div>
    <script type="module" src="/src/index.ts"></script>
    <script>
      window.addEventListener('DOMContentLoaded', () => {
        if (window.SkincareWidget) {
          window.SkincareWidget.init({
            tenantId: "demo",
            container: "#skincare-recommendation-container"
          });
        }
      });
    </script>
  </body>
</html>

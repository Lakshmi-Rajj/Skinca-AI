<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Skinca AI — Completing Sign In...</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0a1210;
      color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 3px solid rgba(110, 231, 183, 0.2);
      border-top-color: #6ee7b7;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    h1 { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
    p { font-size: 13px; color: rgba(255,255,255,0.6); }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <h1>Completing Sign In...</h1>
  <p>Returning you to Skinca AI</p>

  <script>
    // After Clerk processes the OAuth token on the Vercel page,
    // redirect back into the installed APK via the custom scheme.
    // On web browser (non-APK), this is a no-op — Clerk handles it normally.
    (function() {
      var params = window.location.search;
      var hash = window.location.hash;

      // Try to open the native APK via custom scheme deep link
      var nativeUrl = 'com.skinca.ai://sso-callback' + params + hash;

      // Set a fallback: if the APK is not installed, stay on the web app
      var fallbackTimer = setTimeout(function() {
        // If deep link failed (user on browser), redirect to the web app
        window.location.href = 'https://skincare-ai-eta.vercel.app/' + params + hash;
      }, 2000);

      // Try the native deep link
      try {
        window.location.href = nativeUrl;
        // If we get here, the deep link was dispatched
        clearTimeout(fallbackTimer);
      } catch(e) {
        clearTimeout(fallbackTimer);
        window.location.href = 'https://skincare-ai-eta.vercel.app/' + params + hash;
      }
    })();
  </script>
</body>
</html>

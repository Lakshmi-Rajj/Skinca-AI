name: Mobile App Build Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Verify Consumer Mobile App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Consumer Mobile Dependencies
        run: cd apps/consumer-mobile && npm install

      - name: Build Vite Production Bundle
        run: cd apps/consumer-mobile && npm run build

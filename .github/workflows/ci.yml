name: Mobile App Build Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Verify Consumer Mobile App
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/consumer-mobile

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Build Vite Production Bundle
        run: npm run build
